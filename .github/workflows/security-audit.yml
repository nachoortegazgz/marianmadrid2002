name: Security Audit

on:
  push:
    branches:
      - main
      - 'sanitize/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run repository security audit
        run: node scripts/securityAudit.mjs

      - name: ESLint
        run: npx eslint .
